# ~/.scopegate/policies.yaml — SOLO humanos editan este archivo.
# Los agentes proponen cambios vía scopegate_propose_policy → policies.pending.yaml
version: 1

# limits:                                  # TECHOS DUROS (opcionales, globales).
#   max_ttl: 1h                            #   Ningún grant supera este TTL, pidan lo que pidan.
#   deny:                                  #   Globs bloqueados ANTES que cualquier auto_approve
#     - "aws:*:production"                 #   (fail-closed, anti prompt-injection; audit: ceiling_blocked)
#     - "\\*:*"                            #   bloquea peticiones literales "*:*" (inyección típica)
#   rate_limit: 30/m                       #   peticiones a request_capability por agente y ventana
#   approval_ttl: 10m                      #   expiración de solicitudes de aprobación humana

agents:
  agent-luis-nexgen:
    default_ttl: 15m
    # limits:                              # techos por agente: GANAN sobre los globales
    #   max_ttl: 30m
    #   deny: ["stripe:write:*"]
    capabilities:
      - match: "github:call:{get_*,list_*,search_*}"   # lecturas: libre, 15m
        auto_approve: true
      - match: "github:call:*"                          # escrituras: TTL corto
        auto_approve: true
        ttl: 5m
      - match: "notion:call:*"
        auto_approve: true
      # - match: "support:call:get_customer"            # respuestas con PII enmascarada
      #   auto_approve: true                            # (email/teléfono/tarjeta Luhn/aws key id;
      #   ttl: 5m                                       #  best-effort, audit registra SOLO conteos)
      #   redact: [pii]
      - match: "aws:*:production"                       # producción: humano siempre
        require: human_approval                         #   → solicitud en approvals.pending.jsonl
      # - match: "github:call:create_or_update_file"    # when: guarda por ARGUMENTOS de la llamada (M6).
      #   auto_approve: true                            #   Los strings son globs (picomatch), números y
      #   ttl: 5m                                       #   booleanos igualdad estricta. Sin args → la regla
      #   when: { branch: "kimi/*" }                    #   NO matchea (fail-closed) y sigue la siguiente.
      # - match: "github:call:create_or_update_file"    #   → kimi/* auto; cualquier otra rama escala:
      #   require: human_approval
      # - match: "git:credential:easyorder/*"           # scopegate git-credential (M3): git pide credencial
      #   auto_approve: true                            #   → token de GitHub App minteado al momento, TTL
      #   ttl: 10m                                      #   corto, nunca en .git/config. Audit: git_credential_minted
  "*":                                                  # fallback para agentes nuevos
    default_ttl: 5m
    capabilities:
      - match: "*:call:{get_*,list_*,search_*,read_*}"
        auto_approve: true

