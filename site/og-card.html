<!doctype html>
<!-- OG social card (1200×630). Captured to site/og.png by scripts/generate-og-image.mjs.
     Not linked anywhere; noindex by construction (it is a design artifact). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1420;
    color: #dbe2f1;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 72px;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute; border-radius: 50%; filter: blur(120px); opacity: .35;
  }
  .glow-a { width: 520px; height: 520px; background: #5b9dff; top: -260px; right: -140px; }
  .glow-b { width: 380px; height: 380px; background: #51cf8a; bottom: -240px; left: -120px; opacity: .18; }
  .top { display: flex; align-items: center; gap: 14px; position: relative; }
  .top img { width: 44px; height: 44px; }
  .brand { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .pill {
    margin-left: auto;
    border: 1.5px solid rgba(91,157,255,.5); color: #5b9dff;
    border-radius: 999px; padding: 6px 16px;
    font-size: 15px; font-weight: 600;
    background: rgba(91,157,255,.1);
  }
  .claim { position: relative; }
  h1 { font-size: 66px; line-height: 1.06; letter-spacing: -0.025em; font-weight: 800; }
  h1 .accent { color: #5b9dff; }
  .sub {
    margin-top: 22px; font-size: 24px; color: #8b96b0; max-width: 900px;
  }
  .sub b { color: #dbe2f1; }
  .bottom { display: flex; align-items: center; gap: 14px; position: relative; }
  .tag {
    font-family: ui-monospace, Consolas, monospace; font-size: 17px;
    border: 1.5px solid #28324a; border-radius: 8px;
    padding: 9px 16px; color: #8b96b0; background: #171e2e;
  }
  .tag.ok { color: #51cf8a; border-color: rgba(81,207,138,.45); }
</style>
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="top">
    <img src="/favicon.svg" alt="">
    <span class="brand">ScopeGate</span>
    <span class="pill">Open source · Apache-2.0</span>
  </div>
  <div class="claim">
    <h1>Your agents hold <span class="accent">capabilities</span>,<br>not credentials.</h1>
    <p class="sub">Ephemeral credentials for coding agents — Claude Code, Kimi Code,
    Cursor, OpenCode. <b>Secrets never enter the model's context.</b></p>
  </div>
  <div class="bottom">
    <span class="tag ok">TTL grants in minutes</span>
    <span class="tag">AES-256-GCM vault</span>
    <span class="tag">policy engine</span>
    <span class="tag">signed audit</span>
    <span class="tag">MCP-native</span>
  </div>
</body>
</html>
