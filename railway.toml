[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "node docker/bootstrap-prod.mjs && node docker/seed-demo.mjs && node dist/cli.js start --http --port ${PORT:-8080} --host 0.0.0.0"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
